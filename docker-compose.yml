version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: english-assistant-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: english_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - english-assistant-network

  redis:
    image: redis:7-alpine
    container_name: english-assistant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - english-assistant-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  english-assistant-network:
    driver: bridge
